# GitHub/F-Droid release automation will be configured after signing review.
# This placeholder prevents the inherited workflow from publishing to
# 508.dev's obsolete Google Play or self-hosted F-Droid targets.
name: Release preparation
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/sync-version.sh --check
      - run: ./gradlew :app:testDebugUnitTest :app:assembleRelease
